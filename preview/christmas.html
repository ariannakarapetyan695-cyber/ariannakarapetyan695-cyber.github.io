<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="王睿晗的圣诞AIGC视觉运营项目">
  <title>圣诞AIGC视觉运营 | 王睿晗作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yesteryear&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:"Portfolio PingFang";src:local("PingFang SC Regular"),local("PingFangSC-Regular");font-weight:400;font-display:swap}
    @font-face{font-family:"Portfolio PingFang";src:local("PingFang SC Bold"),local("PingFangSC-Semibold");font-weight:700;font-display:swap}
    :root{--header-height:76px;--ink:#080808;--paper:#f3f5f6;--violet:#6b36c5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Portfolio PingFang","PingFang SC","Microsoft YaHei UI",sans-serif}
    header{position:fixed;inset:0 0 auto;height:var(--header-height);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.06)}
    .signature{font:32px/1 "Yesteryear",cursive;transform:rotate(-3deg);color:inherit;text-decoration:none}
    nav{display:flex;align-items:center;gap:clamp(20px,3vw,54px);font-weight:700}
    nav a{color:inherit;text-decoration:none;position:relative}
    nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-8px;height:2px;background:var(--violet);transition:right .25s}
    nav a:hover:after{right:0}.back{display:inline-flex;align-items:center;gap:9px}.back span{font-size:20px;line-height:1}
    main{padding-top:var(--header-height)}
    .project-pages{width:min(100%,1440px);margin:0 auto;background:#fff;box-shadow:0 0 50px rgba(22,35,45,.08)}
    .project-pages img{display:block;width:100%;height:auto;margin:0;background:#fff}
    @media(max-width:760px){:root{--header-height:62px}header{padding:0 16px}.signature{font-size:25px}nav{gap:14px;font-size:11px}nav a:not(.back){display:none}.back span{font-size:17px}.project-pages{box-shadow:none}}
  </style>
</head>
<body>
  <header>
    <a class="signature" href="index.html#home">WangRuihan</a>
    <nav aria-label="项目导航">
      <a class="back" href="index.html#works-aigc"><span aria-hidden="true">←</span> BACK</a>
      <a href="index.html#home">HOME</a>
      <a href="index.html#works">WORKS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#contact">CONTACT</a>
    </nav>
  </header>
  <main>
    <section class="project-pages" aria-label="圣诞AIGC视觉运营项目详情">
      <img src="../portfolio/projects/christmas-pages-hq/page-01.webp" alt="圣诞AIGC视觉运营项目详情第1页" fetchpriority="high">
      <img src="../portfolio/projects/christmas-pages-hq/page-02.webp" alt="圣诞AIGC视觉运营项目详情第2页" loading="lazy" decoding="async">
      <img src="../portfolio/projects/christmas-pages-hq/page-03.webp" alt="圣诞AIGC视觉运营项目详情第3页" loading="lazy" decoding="async">
      <img src="../portfolio/projects/christmas-pages-hq/page-04.webp" alt="圣诞AIGC视觉运营项目详情第4页" loading="lazy" decoding="async">
      <img src="../portfolio/projects/christmas-pages-hq/page-05.webp" alt="圣诞AIGC视觉运营项目详情第5页" loading="lazy" decoding="async">
      <img src="../portfolio/projects/christmas-pages-hq/page-06.webp" alt="圣诞AIGC视觉运营项目详情第6页" loading="lazy" decoding="async">
    </section>
  </main>
</body>
</html>
